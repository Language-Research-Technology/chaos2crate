name: Deploy to GitHub Pages

# Build the Vite app and publish dist/ to GitHub Pages.
# One-time setup: repo Settings → Pages → "Build and deployment" → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy-pages action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Plugins live in a separate repo (benfoley/c2c-plugins), consumed via
      # a "file:../c2c-plugins" dependency in package.json, which needs it
      # checked out as a true sibling directory on disk. actions/checkout's
      # `path` input can't point outside $GITHUB_WORKSPACE (it rejects a
      # path like "../c2c-plugins" outright), so both repos are checked out
      # as subdirectories *of* $GITHUB_WORKSPACE instead — chaos2crate
      # itself included, rather than at the workspace root — so the two end
      # up as siblings under a shared parent, and package.json's
      # "../c2c-plugins" still resolves correctly relative to
      # chaos2crate/package.json's own directory. See SPEC.md
      # §4.7a. Every later step runs from chaos2crate/ accordingly.
      - name: Checkout chaos2crate
        uses: actions/checkout@v4
        with:
          path: chaos2crate

      - name: Checkout c2c-plugins
        uses: actions/checkout@v4
        with:
          repository: benfoley/c2c-plugins
          path: c2c-plugins

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chaos2crate/package-lock.json

      - name: Install c2c-plugins dependencies
        working-directory: c2c-plugins
        run: npm ci

      - name: Install dependencies
        working-directory: chaos2crate
        run: npm ci

      - name: Build
        working-directory: chaos2crate
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: chaos2crate/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
