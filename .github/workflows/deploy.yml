name: Deploy to GitHub Pages

# Build the Vite app and publish dist/ to GitHub Pages.
# One-time setup: repo Settings → Pages → "Build and deployment" → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy-pages action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Plugins live in a separate repo (benfoley/c2c-plugins), consumed via
      # a "file:../c2c-plugins" dependency in package.json — checked out as
      # a sibling of this repo's own checkout so that path resolves. See
      # ARCHITECTURE.md §4.7a.
      - name: Checkout c2c-plugins
        uses: actions/checkout@v4
        with:
          repository: benfoley/c2c-plugins
          path: ../c2c-plugins

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install c2c-plugins dependencies
        working-directory: ../c2c-plugins
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
